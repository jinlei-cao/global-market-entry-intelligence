[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "global-market-entry-intelligence"
version = "0.1.0"
description = "Transparent World Bank indicator-based market screening and weight-sensitivity research."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jinlei Cao"}]
keywords = ["investment-research", "global-operations", "decision-analysis", "market-entry", "econometrics"]
dependencies = ["pandas>=2.0,<3", "numpy>=1.24,<3", "requests>=2.31,<3", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
app = ["streamlit>=1.35,<2", "plotly>=5.20,<7"]
dev = ["pytest>=8,<10", "ruff>=0.7,<1", "nbformat>=5.9,<6"]

[project.scripts]
marketintel = "marketintel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
